<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- Background Layer -->
  <rect width="800" height="1000" fill="#16120D"/>
  <rect x="20" y="20" width="760" height="960" fill="none" stroke="#C0392B" stroke-width="8"/>
  <rect x="35" y="35" width="730" height="930" fill="none" stroke="#E6A100" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Glowing Spotlight -->
  <circle cx="400" cy="380" r="230" fill="#C0392B" opacity="0.22"/>

  <!-- Top Header Tag -->
  <rect x="140" y="60" width="520" height="40" rx="20" fill="#C0392B"/>
  <text x="400" y="86" fill="#FFFFFF" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="15" letter-spacing="3" text-anchor="middle">THE HINDU BREAKING · 5 SEP 2026 · PATIALA HOUSE COURT</text>

  <!-- Main Headline -->
  <text x="400" y="165" fill="#F5EFE6" font-family="'Georgia', serif" font-weight="900" font-size="42" text-anchor="middle" letter-spacing="1">SWATANTRA BHARDWAJ</text>
  <text x="400" y="220" fill="#E6A100" font-family="'Georgia', serif" font-weight="900" font-size="44" text-anchor="middle" letter-spacing="1">ARRESTED IN BULANDSHAHR</text>

  <!-- Subheadline Ribbon -->
  <rect x="50" y="260" width="700" height="55" fill="#231F1A" stroke="#C0392B" stroke-width="2"/>
  <text x="400" y="295" fill="#F5EFE6" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="16" letter-spacing="1" text-anchor="middle">PATIALA HOUSE COURT REMANDS ACCUSED TO 1-DAY POLICE CUSTODY</text>

  <!-- Central Emblem & Graphic Symbol -->
  <g transform="translate(400, 470)">
    <circle r="115" fill="#231F1A" stroke="#C0392B" stroke-width="6"/>
    <circle r="100" fill="none" stroke="#E6A100" stroke-width="2"/>
    
    <!-- Gavel / Handcuff Icon representation with Cockroach Emblem -->
    <path d="M-50,-10 L50,-10 L50,10 L-50,10 Z" fill="#E6A100"/>
    <path d="M-15,-40 L15,-40 L15,40 L-15,40 Z" fill="#C0392B"/>
    <text x="0" y="5" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="36" text-anchor="middle">⚖️</text>
  </g>

  <!-- Slogan Banner Box -->
  <rect x="60" y="640" width="680" height="150" fill="#231F1A" stroke="#E6A100" stroke-width="3"/>
  <text x="400" y="685" fill="#D9572B" font-family="'Georgia', serif" font-weight="900" font-size="22" text-anchor="middle">"JUSTICE FOR SANJAY KUMAR &amp; CJP PROTESTERS"</text>
  <text x="400" y="720" fill="#F5EFE6" font-family="'Georgia', serif" font-weight="900" font-size="19" text-anchor="middle">NO INFLUENCER IS ABOVE THE LAW — POLICE SATELLITE TOWER TRACKING</text>
  <text x="400" y="760" fill="#EADBCE" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" letter-spacing="1" text-anchor="middle">— CJP PARLIAMENT STREET POLICE SIEGE VICTORY</text>

  <!-- Key Metrics -->
  <g transform="translate(80, 815)">
    <rect x="0" y="0" width="200" height="75" fill="#16120D" stroke="#C0392B" stroke-width="2"/>
    <text x="100" y="35" fill="#E6A100" font-family="Georgia" font-weight="900" font-size="24" text-anchor="middle">ARRESTED</text>
    <text x="100" y="58" fill="#EADBCE" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">BULANDSHAHR, UP</text>
  </g>

  <g transform="translate(300, 815)">
    <rect x="0" y="0" width="200" height="75" fill="#16120D" stroke="#C0392B" stroke-width="2"/>
    <text x="100" y="35" fill="#27AE60" font-family="Georgia" font-weight="900" font-size="24" text-anchor="middle">1-DAY CUSTODY</text>
    <text x="100" y="58" fill="#EADBCE" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">PATIALA HOUSE MM COURT</text>
  </g>

  <g transform="translate(520, 815)">
    <rect x="0" y="0" width="200" height="75" fill="#16120D" stroke="#C0392B" stroke-width="2"/>
    <text x="100" y="35" fill="#2980B9" font-family="Georgia" font-weight="900" font-size="24" text-anchor="middle">CJP SIEGE</text>
    <text x="100" y="58" fill="#EADBCE" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">PARLIAMENT ST THANA</text>
  </g>

  <!-- Footer Seal -->
  <text x="400" y="940" fill="#EADBCE" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12" letter-spacing="3" text-anchor="middle">COCKROACH JANTA PARTY · DEMOCRATIC CITIZEN ACTION · 2026</text>
</svg>
