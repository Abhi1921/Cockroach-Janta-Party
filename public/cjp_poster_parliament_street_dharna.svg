<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- Background Layer -->
  <rect width="800" height="1000" fill="#16120D"/>
  <rect x="20" y="20" width="760" height="960" fill="none" stroke="#C0392B" stroke-width="8"/>
  <rect x="35" y="35" width="730" height="930" fill="none" stroke="#E6A100" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Glowing Spotlight -->
  <circle cx="400" cy="380" r="230" fill="#C0392B" opacity="0.18"/>

  <!-- Top Header Tag -->
  <rect x="180" y="60" width="440" height="40" rx="20" fill="#C0392B"/>
  <text x="400" y="86" fill="#FFFFFF" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="15" letter-spacing="3" text-anchor="middle">PARLIAMENT STREET POLICE STATION DHARNA · 4 SEP 2026</text>

  <!-- Main Headline -->
  <text x="400" y="165" fill="#F5EFE6" font-family="'Georgia', serif" font-weight="900" font-size="44" text-anchor="middle" letter-spacing="1">CJP SURROUNDING</text>
  <text x="400" y="220" fill="#E6A100" font-family="'Georgia', serif" font-weight="900" font-size="40" text-anchor="middle" letter-spacing="1">PARLIAMENT STREET THANA</text>

  <!-- Subheadline Ribbon -->
  <rect x="60" y="260" width="680" height="55" fill="#231F1A" stroke="#C0392B" stroke-width="2"/>
  <text x="400" y="295" fill="#F5EFE6" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="18" letter-spacing="1.5" text-anchor="middle">DEMANDING IMMEDIATE ARREST OF INFLUENCER SWATANTRA BHARDWAJ</text>

  <!-- Central Emblem & Graphic Symbol -->
  <g transform="translate(400, 470)">
    <circle r="115" fill="#231F1A" stroke="#C0392B" stroke-width="6"/>
    <circle r="100" fill="none" stroke="#E6A100" stroke-width="2"/>
    
    <!-- Parliament Street Gate & Megaphone Icon -->
    <path d="M-60,40 L-60,-20 L0,-50 L60,-20 L60,40 Z" stroke="#E6A100" stroke-width="4" fill="none"/>
    <path d="M-30,40 L-30,0 L30,0 L30,40 Z" fill="#C0392B" opacity="0.6"/>
    <text x="0" y="-5" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="34" text-anchor="middle">🪳</text>
  </g>

  <!-- Slogan Banner Box -->
  <rect x="60" y="640" width="680" height="150" fill="#231F1A" stroke="#E6A100" stroke-width="3"/>
  <text x="400" y="685" fill="#D9572B" font-family="'Georgia', serif" font-weight="900" font-size="22" text-anchor="middle">"JUSTICE FOR SANJAY KUMAR &amp; STUDENT PROTESTERS"</text>
  <text x="400" y="720" fill="#F5EFE6" font-family="'Georgia', serif" font-weight="900" font-size="20" text-anchor="middle">NO BULLIES ABOVE THE LAW — ARREST THE PERPETRATOR!</text>
  <text x="400" y="760" fill="#EADBCE" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" letter-spacing="1" text-anchor="middle">— SAURAV DAS &amp; NISHU AZAD ON DHARNA · NEW DELHI</text>

  <!-- Key Metrics -->
  <g transform="translate(80, 815)">
    <rect x="0" y="0" width="200" height="75" fill="#16120D" stroke="#C0392B" stroke-width="2"/>
    <text x="100" y="35" fill="#E6A100" font-family="Georgia" font-weight="900" font-size="26" text-anchor="middle">LIVE DHARNA</text>
    <text x="100" y="58" fill="#EADBCE" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">PARLIAMENT STREET</text>
  </g>

  <g transform="translate(300, 815)">
    <rect x="0" y="0" width="200" height="75" fill="#16120D" stroke="#C0392B" stroke-width="2"/>
    <text x="100" y="35" fill="#27AE60" font-family="Georgia" font-weight="900" font-size="26" text-anchor="middle">24 HOURS</text>
    <text x="100" y="58" fill="#EADBCE" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">POLICE ULTIMATUM</text>
  </g>

  <g transform="translate(520, 815)">
    <rect x="0" y="0" width="200" height="75" fill="#16120D" stroke="#C0392B" stroke-width="2"/>
    <text x="100" y="35" fill="#2980B9" font-family="Georgia" font-weight="900" font-size="26" text-anchor="middle">100% PEACEFUL</text>
    <text x="100" y="58" fill="#EADBCE" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">NON-VIOLENT VIGIL</text>
  </g>

  <!-- Footer Seal -->
  <text x="400" y="940" fill="#EADBCE" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12" letter-spacing="3" text-anchor="middle">COCKROACH JANTA PARTY · DEMOCRATIC CITIZEN ACTION · 2026</text>
</svg>
