<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- Background Layer -->
  <rect width="800" height="1000" fill="#16120D"/>
  <rect x="20" y="20" width="760" height="960" fill="none" stroke="#C0392B" stroke-width="8"/>
  <rect x="35" y="35" width="730" height="930" fill="none" stroke="#F5EFE6" stroke-width="2" stroke-dasharray="10 5"/>

  <!-- Top Header Tag -->
  <rect x="180" y="60" width="440" height="40" rx="20" fill="#C0392B"/>
  <text x="400" y="86" fill="#FFFFFF" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="16" letter-spacing="3" text-anchor="middle">NATIONAL ROADWAY LAW GAZETTE · 3 SEP 2026</text>

  <!-- Main Headline -->
  <text x="400" y="170" fill="#F5EFE6" font-family="'Georgia', serif" font-weight="900" font-size="48" text-anchor="middle">3-YEAR CONTRACTOR</text>
  <text x="400" y="230" fill="#E6A100" font-family="'Georgia', serif" font-weight="900" font-size="44" text-anchor="middle">ROAD WARRANTY LAW</text>

  <!-- Subheadline Ribbon -->
  <rect x="80" y="270" width="640" height="50" fill="#231F1A" stroke="#C0392B" stroke-width="2"/>
  <text x="400" y="303" fill="#F5EFE6" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="18" letter-spacing="2" text-anchor="middle">PHYSICAL NOTICE BOARDS MANDATORY ON ALL PWD WORKSITES</text>

  <!-- Central Visual Graphic -->
  <g transform="translate(400, 480)">
    <rect x="-120" y="-80" width="240" height="160" fill="#231F1A" stroke="#C0392B" stroke-width="6" rx="10"/>
    <text x="0" y="-35" fill="#E6A100" font-family="sans-serif" font-weight="900" font-size="16" text-anchor="middle">PWD CONTRACTOR WARRANTY BOARD</text>
    <text x="0" y="-5" fill="#F5EFE6" font-family="sans-serif" font-weight="700" font-size="12" text-anchor="middle">CONTRACTOR: ABC INFRASTRUCTURE LTD</text>
    <text x="0" y="20" fill="#F5EFE6" font-family="sans-serif" font-weight="700" font-size="12" text-anchor="middle">WARRANTY EXPIRY: 03 SEP 2029</text>
    <text x="0" y="45" fill="#D9572B" font-family="sans-serif" font-weight="900" font-size="14" text-anchor="middle">REPAIR CALL: 1800-AUDIT-PWD</text>
  </g>

  <!-- Slogan Banner Box -->
  <rect x="70" y="650" width="660" height="140" fill="#231F1A" stroke="#E6A100" stroke-width="3"/>
  <text x="400" y="700" fill="#C0392B" font-family="'Georgia', serif" font-weight="900" font-size="24" text-anchor="middle">"NAME THE CONTRACTOR BEFORE THE ROAD CAVIES IN.</text>
  <text x="400" y="735" fill="#C0392B" font-family="'Georgia', serif" font-weight="900" font-size="24" text-anchor="middle">NO MORE REPAYING FOR RE-PAVING."</text>
  <text x="400" y="770" fill="#EADBCE" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" letter-spacing="1" text-anchor="middle">— CJP ASPHALT QUALITY AUDIT GUILD · PUNE / MUMBAI</text>

  <!-- Impact Metrics -->
  <g transform="translate(100, 820)">
    <rect x="0" y="0" width="180" height="70" fill="#16120D" stroke="#C0392B" stroke-width="2"/>
    <text x="90" y="32" fill="#E6A100" font-family="Georgia" font-weight="900" font-size="26" text-anchor="middle">3 YEARS</text>
    <text x="90" y="54" fill="#EADBCE" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">MANDATORY WARRANTY</text>
  </g>

  <g transform="translate(310, 820)">
    <rect x="0" y="0" width="180" height="70" fill="#16120D" stroke="#C0392B" stroke-width="2"/>
    <text x="90" y="32" fill="#27AE60" font-family="Georgia" font-weight="900" font-size="26" text-anchor="middle">100%</text>
    <text x="90" y="54" fill="#EADBCE" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">WORKSITE BOARDS</text>
  </g>

  <g transform="translate(520, 820)">
    <rect x="0" y="0" width="180" height="70" fill="#16120D" stroke="#C0392B" stroke-width="2"/>
    <text x="90" y="32" fill="#2980B9" font-family="Georgia" font-weight="900" font-size="26" text-anchor="middle">18,400</text>
    <text x="90" y="54" fill="#EADBCE" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">LOGGED POTHOLES</text>
  </g>

  <!-- Footer Seal -->
  <text x="400" y="940" fill="#EADBCE" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12" letter-spacing="3" text-anchor="middle">COCKROACH JANTA PARTY · ROADWAY INTEGRITY BUREAU · 2026</text>
</svg>
