<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- Background Layer -->
  <rect width="800" height="1000" fill="#16120D"/>
  <rect x="20" y="20" width="760" height="960" fill="none" stroke="#D9572B" stroke-width="8"/>
  <rect x="35" y="35" width="730" height="930" fill="none" stroke="#E6A100" stroke-width="2" stroke-dasharray="8 6"/>

  <circle cx="400" cy="380" r="220" fill="#D9572B" opacity="0.15"/>

  <!-- Header Tag -->
  <rect x="160" y="60" width="480" height="40" rx="20" fill="#D9572B"/>
  <text x="400" y="86" fill="#FFFFFF" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="15" letter-spacing="3" text-anchor="middle">POLITICAL IMPACT EXCLUSIVE · THE INDIAN EXPRESS</text>

  <!-- Title -->
  <text x="400" y="165" fill="#F5EFE6" font-family="'Georgia', serif" font-weight="900" font-size="44" text-anchor="middle">MINISTERIAL ACCOUNTABILITY</text>
  <text x="400" y="220" fill="#E6A100" font-family="'Georgia', serif" font-weight="900" font-size="38" text-anchor="middle">DHARMENDRA PRADHAN RESIGNATION</text>

  <!-- Subheadline -->
  <rect x="60" y="260" width="680" height="55" fill="#231F1A" stroke="#D9572B" stroke-width="2"/>
  <text x="400" y="295" fill="#F5EFE6" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="17" letter-spacing="1.5" text-anchor="middle">ASHUTOSH RANKA EXPLAINS HOW 37 DAYS OF CJP PROTESTS FORCED ACTION</text>

  <!-- Central Emblem -->
  <g transform="translate(400, 470)">
    <circle r="110" fill="#231F1A" stroke="#D9572B" stroke-width="6"/>
    <circle r="96" fill="none" stroke="#E6A100" stroke-width="2"/>
    <text x="0" y="-10" fill="#D9572B" font-family="'Georgia', serif" font-weight="900" font-size="32" text-anchor="middle">37 DAYS</text>
    <text x="0" y="25" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="14" text-anchor="middle">CITIZEN PRESSURE</text>
  </g>

  <!-- Slogan Box -->
  <rect x="60" y="640" width="680" height="150" fill="#231F1A" stroke="#E6A100" stroke-width="3"/>
  <text x="400" y="685" fill="#D9572B" font-family="'Georgia', serif" font-weight="900" font-size="22" text-anchor="middle">"37 DAYS OF APATHY COLLAPSED BEFORE UNYIELDING YOUTH VIGIL"</text>
  <text x="400" y="720" fill="#F5EFE6" font-family="'Georgia', serif" font-weight="900" font-size="18" text-anchor="middle">PUBLIC DEMOCRACY FORCES MINISTERIAL ACCOUNTABILITY FOR EXAM REFORMS</text>
  <text x="400" y="760" fill="#EADBCE" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" letter-spacing="1" text-anchor="middle">— ASHUTOSH RANKA IN EXCLUSIVE INTERVIEW WITH THE INDIAN EXPRESS</text>

  <!-- Metrics -->
  <g transform="translate(80, 815)">
    <rect x="0" y="0" width="200" height="75" fill="#16120D" stroke="#D9572B" stroke-width="2"/>
    <text x="100" y="35" fill="#E6A100" font-family="Georgia" font-weight="900" font-size="26" text-anchor="middle">37 DAYS</text>
    <text x="100" y="58" fill="#EADBCE" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">JANTAR MANTAR VIGIL</text>
  </g>

  <g transform="translate(300, 815)">
    <rect x="0" y="0" width="200" height="75" fill="#16120D" stroke="#D9572B" stroke-width="2"/>
    <text x="100" y="35" fill="#27AE60" font-family="Georgia" font-weight="900" font-size="26" text-anchor="middle">RESIGNED</text>
    <text x="100" y="58" fill="#EADBCE" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">MINISTERIAL EXIT</text>
  </g>

  <g transform="translate(520, 815)">
    <rect x="0" y="0" width="200" height="75" fill="#16120D" stroke="#D9572B" stroke-width="2"/>
    <text x="100" y="35" fill="#2980B9" font-family="Georgia" font-weight="900" font-size="26" text-anchor="middle">EXAM LAWS</text>
    <text x="100" y="58" fill="#EADBCE" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">LEAK PREVENTION</text>
  </g>

  <!-- Footer -->
  <text x="400" y="940" fill="#EADBCE" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12" letter-spacing="3" text-anchor="middle">COCKROACH JANTA PARTY · POLITICAL ACCOUNTABILITY WING · 2026</text>
</svg>
