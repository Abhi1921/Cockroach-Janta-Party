<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- Background Layer -->
  <rect width="800" height="1000" fill="#16120D"/>
  <rect x="20" y="20" width="760" height="960" fill="none" stroke="#E6A100" stroke-width="8"/>
  <rect x="35" y="35" width="730" height="930" fill="none" stroke="#D9572B" stroke-width="2" stroke-dasharray="8 6"/>

  <circle cx="400" cy="380" r="220" fill="#E6A100" opacity="0.15"/>

  <!-- Header Tag -->
  <rect x="180" y="60" width="440" height="40" rx="20" fill="#E6A100"/>
  <text x="400" y="86" fill="#16120D" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="15" letter-spacing="3" text-anchor="middle">SEPTEMBER 5 MARCH CALLED OFF · OFFICIAL ANNOUNCEMENT</text>

  <!-- Title -->
  <text x="400" y="165" fill="#F5EFE6" font-family="'Georgia', serif" font-weight="900" font-size="44" text-anchor="middle">SEPTEMBER 5 MARCH</text>
  <text x="400" y="220" fill="#D9572B" font-family="'Georgia', serif" font-weight="900" font-size="40" text-anchor="middle">WITHDRAWN AFTER SC ORDER</text>

  <!-- Subheadline -->
  <rect x="60" y="260" width="680" height="55" fill="#231F1A" stroke="#E6A100" stroke-width="2"/>
  <text x="400" y="295" fill="#F5EFE6" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="17" letter-spacing="1.5" text-anchor="middle">SAURAV DAS INFORMS SUPREME COURT BENCH AS DEMANDS ARE ACCEPTED</text>

  <!-- Central Emblem -->
  <g transform="translate(400, 470)">
    <circle r="110" fill="#231F1A" stroke="#E6A100" stroke-width="6"/>
    <circle r="96" fill="none" stroke="#D9572B" stroke-width="2"/>
    <text x="0" y="-10" fill="#E6A100" font-family="'Georgia', serif" font-weight="900" font-size="30" text-anchor="middle">STAND DOWN</text>
    <text x="0" y="25" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="14" text-anchor="middle">MISSION ACCOMPLISHED</text>
  </g>

  <!-- Slogan Box -->
  <rect x="60" y="640" width="680" height="150" fill="#231F1A" stroke="#D9572B" stroke-width="3"/>
  <text x="400" y="685" fill="#E6A100" font-family="'Georgia', serif" font-weight="900" font-size="22" text-anchor="middle">"WHEN JUSTICE IS DELIVERED BY THE TOP COURT, WE HONOR DEMOCRACY"</text>
  <text x="400" y="720" fill="#F5EFE6" font-family="'Georgia', serif" font-weight="900" font-size="18" text-anchor="middle">SWARMS PIVOT FROM STREET MARCHES BACK TO 24/7 MUNICIPAL WARD AUDITS</text>
  <text x="400" y="760" fill="#EADBCE" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" letter-spacing="1" text-anchor="middle">— LIVE LAW / TOI / THE HINDU BENCH COVERAGE</text>

  <!-- Metrics -->
  <g transform="translate(80, 815)">
    <rect x="0" y="0" width="200" height="75" fill="#16120D" stroke="#E6A100" stroke-width="2"/>
    <text x="100" y="35" fill="#D9572B" font-family="Georgia" font-weight="900" font-size="26" text-anchor="middle">SEPT 5</text>
    <text x="100" y="58" fill="#EADBCE" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">MARCH DEFERRED</text>
  </g>

  <g transform="translate(300, 815)">
    <rect x="0" y="0" width="200" height="75" fill="#16120D" stroke="#E6A100" stroke-width="2"/>
    <text x="100" y="35" fill="#27AE60" font-family="Georgia" font-weight="900" font-size="26" text-anchor="middle">84 CITIES</text>
    <text x="100" y="58" fill="#EADBCE" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">WARD AUDITS LIVE</text>
  </g>

  <g transform="translate(520, 815)">
    <rect x="0" y="0" width="200" height="75" fill="#16120D" stroke="#E6A100" stroke-width="2"/>
    <text x="100" y="35" fill="#2980B9" font-family="Georgia" font-weight="900" font-size="26" text-anchor="middle">CENTRE</text>
    <text x="100" y="58" fill="#EADBCE" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">FULFILLED DEMANDS</text>
  </g>

  <!-- Footer -->
  <text x="400" y="940" fill="#EADBCE" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12" letter-spacing="3" text-anchor="middle">COCKROACH JANTA PARTY · NATIONAL SECRETARIAT · 2026</text>
</svg>
