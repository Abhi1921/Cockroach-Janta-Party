  <text x="400" y="86" fill="#FFFFFF" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="15" letter-spacing="3" text-anchor="middle">SUPREME COURT HISTORIC VERDICT · 2 SEP 2026</text>

  <!-- Title -->
  <text x="400" y="165" fill="#F5EFE6" font-family="'Georgia', serif" font-weight="900" font-size="44" text-anchor="middle">ALL FIRS QUASHED</text>
  <text x="400" y="220" fill="#E6A100" font-family="'Georgia', serif" font-weight="900" font-size="40" text-anchor="middle">UNDER ARTICLE 142</text>

