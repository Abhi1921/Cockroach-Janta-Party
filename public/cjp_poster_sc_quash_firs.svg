  <text x="400" y="720" fill="#F5EFE6" font-family="'Georgia', serif" font-weight="900" font-size="18" text-anchor="middle">NO FRESH FIRS CAN BE REGISTERED AGAINST GEN-Z PROTESTERS</text>
