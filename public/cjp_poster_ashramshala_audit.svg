<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- Background Layer -->
  <rect width="800" height="1000" fill="#141B10"/>
  <rect x="20" y="20" width="760" height="960" fill="none" stroke="#27AE60" stroke-width="8"/>
  <rect x="35" y="35" width="730" height="930" fill="none" stroke="#E6A100" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Top Header Tag -->
  <rect x="140" y="60" width="520" height="40" rx="20" fill="#27AE60"/>
  <text x="400" y="86" fill="#FFFFFF" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="14" letter-spacing="3" text-anchor="middle">DAILY PIONEER REPORT · TRIBAL EDUCATION &amp; HOSTEL AUDIT</text>

  <!-- Main Headline -->
  <text x="400" y="165" fill="#F5EFE6" font-family="'Georgia', serif" font-weight="900" font-size="38" text-anchor="middle" letter-spacing="1">CJP CHIEF URGES FADNAVIS</text>
  <text x="400" y="220" fill="#E6A100" font-family="'Georgia', serif" font-weight="900" font-size="36" text-anchor="middle" letter-spacing="1">VISIT MAHARASHTRA ASHRAMSHALAS</text>

  <!-- Subheadline Ribbon -->
  <rect x="50" y="260" width="700" height="55" fill="#202E1B" stroke="#27AE60" stroke-width="2"/>
  <text x="400" y="295" fill="#F5EFE6" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="16" letter-spacing="1" text-anchor="middle">ABHIJEET DIPKE CITES POOR FACILITIES, SUBSTANDARD FOOD &amp; SAFETY VIOLATIONS</text>

  <!-- Central Emblem & Graphic Symbol -->
  <g transform="translate(400, 470)">
