    <circle r="100" fill="none" stroke="#E6A100" stroke-width="2"/>
    <text x="0" y="15" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="52" text-anchor="middle">🏫🎒</text>
  </g>

  <!-- Slogan Banner Box -->
  <rect x="60" y="640" width="680" height="150" fill="#202E1B" stroke="#E6A100" stroke-width="3"/>
  <text x="400" y="685" fill="#27AE60" font-family="'Georgia', serif" font-weight="900" font-size="22" text-anchor="middle">"DIGNITY &amp; SAFETY FOR TRIBAL STUDENTS"</text>
  <text x="400" y="720" fill="#F5EFE6" font-family="'Georgia', serif" font-weight="900" font-size="18" text-anchor="middle">INSPECT HOSTELS PERSONALLY — PUBLIC AUDITS WILL NOT STOP</text>
  <text x="400" y="760" fill="#EADBCE" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" letter-spacing="1" text-anchor="middle">— CJP FOUNDER ABHIJEET DIPKE DISPATCH</text>

  <!-- Key Metrics -->
  <g transform="translate(80, 815)">
    <rect x="0" y="0" width="200" height="75" fill="#141B10" stroke="#27AE60" stroke-width="2"/>
    <text x="100" y="35" fill="#E6A100" font-family="Georgia" font-weight="900" font-size="22" text-anchor="middle">ASHRAMSHALAS</text>
    <text x="100" y="58" fill="#EADBCE" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">MAHARASHTRA TRIBAL SCHOOLS</text>
  </g>

  <g transform="translate(300, 815)">
    <rect x="0" y="0" width="200" height="75" fill="#141B10" stroke="#27AE60" stroke-width="2"/>
    <text x="100" y="35" fill="#D9572B" font-family="Georgia" font-weight="900" font-size="22" text-anchor="middle">DIPKE LETTER</text>
    <text x="100" y="58" fill="#EADBCE" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">TO CM DEVENDRA FADNAVIS</text>
