    <text x="100" y="35" fill="#2980B9" font-family="Georgia" font-weight="900" font-size="22" text-anchor="middle">FOOD &amp; SAFETY</text>
    <text x="100" y="58" fill="#EADBCE" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">URGENT UPGRADES MANDATED</text>
