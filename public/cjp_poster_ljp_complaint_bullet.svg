  <text x="400" y="720" fill="#F5EFE6" font-family="'Georgia', serif" font-weight="900" font-size="18" text-anchor="middle">LJP FILES COMPLAINT WHILE POLICE APPREHEND ACCUSED IN BULANDSHAHR</text>
