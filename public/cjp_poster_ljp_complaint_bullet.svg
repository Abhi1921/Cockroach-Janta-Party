  <!-- Main Headline -->
  <text x="400" y="165" fill="#F5EFE6" font-family="'Georgia', serif" font-weight="900" font-size="38" text-anchor="middle" letter-spacing="1">CHIRAG PASWAN'S LJP FILES COMPLAINT</text>
  <text x="400" y="220" fill="#E6A100" font-family="'Georgia', serif" font-weight="900" font-size="34" text-anchor="middle" letter-spacing="1">ACCUSED FLED ON BULLET MOTORCYCLE</text>

