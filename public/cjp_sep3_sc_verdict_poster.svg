<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- Background Layer -->
  <rect width="800" height="1000" fill="#16120D"/>
  <rect x="20" y="20" width="760" height="960" fill="none" stroke="#D9572B" stroke-width="8"/>
  <rect x="35" y="35" width="730" height="930" fill="none" stroke="#E6A100" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Radial Glow Behind Emblem -->
  <circle cx="400" cy="380" r="220" fill="#D9572B" opacity="0.15"/>

  <!-- Top Header Tag -->
  <rect x="200" y="60" width="400" height="40" rx="20" fill="#D9572B"/>
  <text x="400" y="86" fill="#FFFFFF" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="16" letter-spacing="3" text-anchor="middle">OFFICIAL CJP LEGAL BULLETIN · 3 SEP 2026</text>

  <!-- Main Headline -->
  <text x="400" y="170" fill="#F5EFE6" font-family="'Georgia', serif" font-weight="900" font-size="52" text-anchor="middle" letter-spacing="1">SUPREME COURT</text>
  <text x="400" y="230" fill="#E6A100" font-family="'Georgia', serif" font-weight="900" font-size="46" text-anchor="middle" letter-spacing="1">ARTICLE 142 DECREE</text>

  <!-- Subheadline Ribbon -->
  <rect x="80" y="270" width="640" height="50" fill="#231F1A" stroke="#D9572B" stroke-width="2"/>
  <text x="400" y="303" fill="#F5EFE6" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="20" letter-spacing="2" text-anchor="middle">2,700 STUDENT FIRS EXPUNGED NATIONWIDE</text>

  <!-- Central Mascot Emblem Graphics -->
  <g transform="translate(400, 480)">
    <circle r="110" fill="#231F1A" stroke="#D9572B" stroke-width="6"/>
    <circle r="96" fill="none" stroke="#E6A100" stroke-width="2"/>
    
    <!-- Stylized Cockroach / Scales of Justice Graphic -->
    <path d="M-40,-30 L40,-30 M0,-60 L0,50 M-60,30 L-20,30 L-40,-10 Z M20,30 L60,30 L40,-10 Z" stroke="#E6A100" stroke-width="5" fill="none"/>
    <circle cx="0" cy="-60" r="12" fill="#D9572B"/>
    <text x="0" y="8" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="28" text-anchor="middle">🪳</text>
  </g>

  <!-- Slogan Banner Box -->
  <rect x="70" y="650" width="660" height="140" fill="#231F1A" stroke="#E6A100" stroke-width="3"/>
  <text x="400" y="700" fill="#D9572B" font-family="'Georgia', serif" font-weight="900" font-size="24" text-anchor="middle">"NO STUDENT SHALL CARRY A CRIMINAL RECORD</text>
  <text x="400" y="735" fill="#D9572B" font-family="'Georgia', serif" font-weight="900" font-size="24" text-anchor="middle">FOR ASKING CIVIC QUESTIONS."</text>
  <text x="400" y="770" fill="#EADBCE" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" letter-spacing="1" text-anchor="middle">— CJP LEGAL ADVOCACY SECRETARIAT · NEW DELHI BENCH</text>

  <!-- Key Impact Metrics -->
  <g transform="translate(100, 820)">
    <rect x="0" y="0" width="180" height="70" fill="#16120D" stroke="#D9572B" stroke-width="2"/>
    <text x="90" y="32" fill="#E6A100" font-family="Georgia" font-weight="900" font-size="26" text-anchor="middle">100%</text>
    <text x="90" y="54" fill="#EADBCE" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">CASES DROPPED</text>
  </g>

  <g transform="translate(310, 820)">
    <rect x="0" y="0" width="180" height="70" fill="#16120D" stroke="#D9572B" stroke-width="2"/>
    <text x="90" y="32" fill="#27AE60" font-family="Georgia" font-weight="900" font-size="26" text-anchor="middle">2,700</text>
    <text x="90" y="54" fill="#EADBCE" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">STUDENTS IMMUNE</text>
  </g>

  <g transform="translate(520, 820)">
    <rect x="0" y="0" width="180" height="70" fill="#16120D" stroke="#D9572B" stroke-width="2"/>
    <text x="90" y="32" fill="#2980B9" font-family="Georgia" font-weight="900" font-size="26" text-anchor="middle">36 STATES</text>
    <text x="90" y="54" fill="#EADBCE" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">APEX COMPLIANCE</text>
  </g>

  <!-- Footer Seal -->
  <text x="400" y="940" fill="#EADBCE" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12" letter-spacing="3" text-anchor="middle">COCKROACH JANTA PARTY · HAR GHAR KI SARKAR · EST. 2026</text>
</svg>
