<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- Background Layer -->
  <rect width="800" height="1000" fill="#16120D"/>
  <rect x="20" y="20" width="760" height="960" fill="none" stroke="#2980B9" stroke-width="8"/>
  <rect x="35" y="35" width="730" height="930" fill="none" stroke="#E6A100" stroke-width="2" stroke-dasharray="8 6"/>

  <circle cx="400" cy="380" r="220" fill="#2980B9" opacity="0.15"/>

  <!-- Header Tag -->
  <rect x="180" y="60" width="440" height="40" rx="20" fill="#2980B9"/>
  <text x="400" y="86" fill="#FFFFFF" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="15" letter-spacing="3" text-anchor="middle">FACIAL RECOGNITION EXPOSÉ · THE PRINT &amp; IE</text>

  <!-- Title -->
  <text x="400" y="165" fill="#F5EFE6" font-family="'Georgia', serif" font-weight="900" font-size="44" text-anchor="middle">DELHI POLICE FAILED</text>
  <text x="400" y="220" fill="#E6A100" font-family="'Georgia', serif" font-weight="900" font-size="40" text-anchor="middle">AI SURVEILLANCE FIASCO</text>

  <!-- Subheadline -->
  <rect x="60" y="260" width="680" height="55" fill="#231F1A" stroke="#2980B9" stroke-width="2"/>
  <text x="400" y="295" fill="#F5EFE6" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="17" letter-spacing="1.5" text-anchor="middle">2,873 FLAGGED HISTORY SHEETERS — 162 WERE ACTUALLY IN JAIL!</text>

  <!-- Central Graphic -->
  <g transform="translate(400, 470)">
