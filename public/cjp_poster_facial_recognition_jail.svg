    <!-- Camera Viewfinder Lines -->
    <path d="M-80,-60 L-60,-60 M80,-60 L60,-60 M-80,60 L-60,60 M80,60 L60,60" stroke="#2980B9" stroke-width="6"/>
    <text x="0" y="-10" fill="#C0392B" font-family="'Georgia', serif" font-weight="900" font-size="32" text-anchor="middle">162</text>
    <text x="0" y="25" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="14" text-anchor="middle">IN PRISON CELLS</text>
  </g>

  <!-- Slogan Box -->
  <rect x="60" y="640" width="680" height="150" fill="#231F1A" stroke="#E6A100" stroke-width="3"/>
  <text x="400" y="685" fill="#2980B9" font-family="'Georgia', serif" font-weight="900" font-size="22" text-anchor="middle">"YOU CANNOT FRAMED INNOCENT STUDENTS WITH BROKEN AI"</text>
