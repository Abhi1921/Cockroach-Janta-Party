  <!-- Metrics -->
  <g transform="translate(80, 815)">
    <rect x="0" y="0" width="200" height="75" fill="#16120D" stroke="#2980B9" stroke-width="2"/>
    <text x="100" y="35" fill="#E6A100" font-family="Georgia" font-weight="900" font-size="26" text-anchor="middle">2,873</text>
    <text x="100" y="58" fill="#EADBCE" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">PROBED BY POLICE</text>
  </g>

  <g transform="translate(300, 815)">
