  <text x="400" y="86" fill="#16120D" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="14" letter-spacing="3" text-anchor="middle">HT &amp; INDIA TODAY REPORT · INTERNAL SPLINTER DISPUTE</text>

  <!-- Main Headline -->
  <text x="400" y="165" fill="#F5EFE6" font-family="'Georgia', serif" font-weight="900" font-size="40" text-anchor="middle" letter-spacing="1">REBEL FLOATS 'CJP-DEMOCRATIC'</text>
  <text x="400" y="220" fill="#D9572B" font-family="'Georgia', serif" font-weight="900" font-size="38" text-anchor="middle" letter-spacing="1">CLAIMS CJP IS 'TEAM KEJRIWAL'</text>

