  <text x="400" y="720" fill="#F5EFE6" font-family="'Georgia', serif" font-weight="900" font-size="18" text-anchor="middle">CJP REMAINS 100% NON-PARTISAN &amp; COMMITTED TO MUNICIPAL AUDITS</text>
  <text x="400" y="760" fill="#EADBCE" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" letter-spacing="1" text-anchor="middle">— CJP FOUNDING SECRETARIAT STATEMENT</text>

