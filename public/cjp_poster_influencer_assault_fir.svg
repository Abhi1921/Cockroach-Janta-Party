  <text x="400" y="720" fill="#F5EFE6" font-family="'Georgia', serif" font-weight="900" font-size="18" text-anchor="middle">ACCOUNTABILITY FOR SANJAY KUMAR & ALL PROTESTING FAMILIES</text>
