  <!-- Footer Seal -->
  <text x="400" y="940" fill="#EADBCE" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12" letter-spacing="3" text-anchor="middle">COCKROACH JANTA PARTY · POLICE ACCOUNTABILITY DESK · 2026</text>
</svg>
