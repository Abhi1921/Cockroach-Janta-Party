<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Radial Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#231F1A" />
      <stop offset="100%" stop-color="#16120D" />
    </radialGradient>
    
    <!-- Vermilion Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E86335" />
      <stop offset="100%" stop-color="#B83A12" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7C948" />
      <stop offset="100%" stop-color="#C79210" />
    </linearGradient>

    <!-- Curved Text Path -->
    <path id="textArcTop" d="M 76 256 A 180 180 0 1 1 436 256" />
    <path id="textArcBottom" d="M 436 256 A 180 180 0 0 1 76 256" />
  </defs>

  <!-- 1. Outer Edge Shadow -->
  <circle cx="256" cy="256" r="248" fill="#0A0806" />

  <!-- 2. Main Outer Circle Ring (Dark Charcoal) -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="12" />

  <!-- 3. Inner Gold Accent Ring -->
  <circle cx="256" cy="256" r="222" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="6,4" />
  <circle cx="256" cy="256" r="214" fill="none" stroke="#D9572B" stroke-width="3" />

  <!-- 4. Inner Emblem Circle -->
  <circle cx="256" cy="256" r="172" fill="#F5EFE6" stroke="#16120D" stroke-width="8" />

  <!-- 5. Tricolor Ribbon Ring Base (Bottom Arc) -->
  <path d="M 104 300 A 172 172 0 0 0 408 300 L 396 340 A 160 160 0 0 1 116 340 Z" fill="#16120D" />
  
  <!-- Tricolor Stripes -->
  <path d="M 120 310 Q 256 420 392 310" stroke="#FF9933" stroke-width="6" fill="none" />
  <path d="M 124 320 Q 256 430 388 320" stroke="#FFFFFF" stroke-width="6" fill="none" />
  <path d="M 128 330 Q 256 440 384 330" stroke="#138808" stroke-width="6" fill="none" />

  <!-- 6. THE COCKROACH MASCOT (CENTER ILLUSTRATION WITH SUNGLASSES) -->
  <g transform="translate(256, 252)">
    
    <!-- Antennae -->
    <path d="M -12 -55 C -35 -115 -85 -145 -115 -165" stroke="#16120D" stroke-width="7" stroke-linecap="round" fill="none" />
    <path d="M 12 -55 C 35 -115 85 -145 115 -165" stroke="#16120D" stroke-width="7" stroke-linecap="round" fill="none" />

    <path d="M -12 -55 C -25 -105 -70 -135 -95 -150" stroke="#D9572B" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 12 -55 C 25 -105 70 -135 95 -150" stroke="#D9572B" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Legs (6 Legs) -->
    <!-- Left Top Leg -->
    <path d="M -30 -25 L -75 -45 L -105 -30" stroke="#16120D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Left Middle Leg -->
    <path d="M -35 10 L -85 10 L -115 35" stroke="#16120D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Left Bottom Leg -->
    <path d="M -30 45 L -80 75 L -100 110" stroke="#16120D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Right Top Leg -->
    <path d="M 30 -25 L 75 -45 L 105 -30" stroke="#16120D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Right Middle Leg -->
    <path d="M 35 10 L 85 10 L 115 35" stroke="#16120D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Right Bottom Leg -->
    <path d="M 30 45 L 80 75 L 100 110" stroke="#16120D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Body Shell - Thorax & Abdomen -->
    <ellipse cx="0" cy="35" rx="36" ry="58" fill="#D9572B" stroke="#16120D" stroke-width="7" />
    
    <!-- Abdomen Segment Lines -->
    <path d="M -30 15 Q 0 25 30 15" stroke="#16120D" stroke-width="5" fill="none" />
    <path d="M -32 35 Q 0 45 32 35" stroke="#16120D" stroke-width="5" fill="none" />
    <path d="M -30 55 Q 0 65 30 55" stroke="#16120D" stroke-width="5" fill="none" />
    <path d="M -24 75 Q 0 83 24 75" stroke="#16120D" stroke-width="5" fill="none" />

    <!-- Outer Folded Wings -->
    <path d="M -4 -25 C -55 0 -58 75 -15 90 C -4 95 -2 70 -4 -25 Z" fill="#B83A12" stroke="#16120D" stroke-width="6" />
    <path d="M 4 -25 C 55 0 58 75 15 90 C 4 95 2 70 4 -25 Z" fill="#B83A12" stroke="#16120D" stroke-width="6" />

    <!-- Wing Highlights -->
    <path d="M -18 10 C -35 35 -30 65 -15 75" stroke="#F7C948" stroke-width="3" fill="none" />
    <path d="M 18 10 C 35 35 30 65 15 75" stroke="#F7C948" stroke-width="3" fill="none" />

    <!-- Head Shell -->
    <ellipse cx="0" cy="-42" rx="26" ry="22" fill="#16120D" />
    <ellipse cx="0" cy="-42" rx="24" ry="20" fill="#D9572B" />

    <!-- COOL BLACK SUNGLASSES -->
    <!-- Left Lens -->
    <polygon points="-24,-48 -3,-48 -6,-35 -20,-35" fill="#16120D" stroke="#000000" stroke-width="2" />
    <!-- Right Lens -->
    <polygon points="3,-48 24,-48 20,-35 6,-35" fill="#16120D" stroke="#000000" stroke-width="2" />
    <!-- Sunglasses Bridge -->
    <rect x="-4" y="-47" width="8" height="3" fill="#16120D" />
    <!-- Sunglasses Glare -->
    <line x1="-18" y1="-45" x2="-10" y2="-37" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="-45" x2="16" y2="-37" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

    <!-- Confidence Mouth Smile -->
    <path d="M -10 -27 Q 0 -20 10 -27" stroke="#16120D" stroke-width="4" stroke-linecap="round" fill="none" />

  </g>

  <!-- 7. CURVED TYPOGRAPHY TEXT -->
  <!-- Top Arc: COCKROACH JANTA PARTY -->
  <text font-family="'Bebas Neue', 'Inter', 'Impact', sans-serif" font-size="34" font-weight="900" letter-spacing="4" fill="#F5EFE6">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      COCKROACH JANTA PARTY
    </textPath>
  </text>

  <!-- Side Stars -->
  <g fill="#F7C948">
    <!-- Left Star -->
    <polygon points="76,256 81,244 93,244 83,235 87,223 76,230 65,223 69,235 59,244 71,244" transform="translate(14,0)" />
    <!-- Right Star -->
    <polygon points="436,256 441,244 453,244 443,235 447,223 436,230 425,223 429,235 419,244 431,244" transform="translate(-14,0)" />
  </g>

  <!-- Bottom Banner: CIVIC SATIRE & TRANSPARENCY · 2026 -->
  <text font-family="'Inter', sans-serif" font-size="13" font-weight="800" letter-spacing="3" fill="#F7C948">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      ★ ESTD 2026 · FOR THE PEOPLE ★
    </textPath>
  </text>

</svg>
